---
layout: none
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ site.title }}</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; }
        .banner {padding:20px; width: 100%; height: auto; }
        .content { padding: 20px; text-align: left; max-width: 800px;}
        ul { list-style-type: disc; padding-left: 40px; text-align: left; display: inline-block; }
        .buttons { margin-top: 20px; }
        .buttons a {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .buttons a:hover { background-color: #0056b3; }
        h1 { margin-top: 0; }
        p { line-height: 1.6; }
    </style>
</head>
<body>
    <!-- Banner -->
    <img src="{{ site.banner_image }}" alt="{{ site.banner_image }}" class="banner">

    <!-- Welcome message -->
    <div class="content">
        <h1>{{ site.welcome_message }}</h1>

        <!-- Bullet points -->
        <ul>
            {% for point in site.bullet_points %}
                <li>{{ point }}</li>
            {% endfor %}
        </ul>

        <!-- Buttons -->
        <div class="buttons">
            {% for btn in site.buttons %}
                <a href="{{ btn.url }}" target="_blank">{{ btn.text }}</a>
            {% endfor %}
        </div>
    </div>
</body>
</html>

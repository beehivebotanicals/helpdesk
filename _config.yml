# Site settings
show_downloads: false
show_buttons: true
google_analytics:
env:
  -repo: helpdesk
remote_theme: pages-themes/tactile@v0.2.0
banner_image: Beehive2.jpg
banner_image_alt: Beehive logo
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one
title: HelpDesk
description: Providing a safe space for working together!
# welcome_message: "Welcome to Beehive HelpDesk!"
# GitHub Buttons configuration
# "/issues/new/choose"
buttons:
  - text: "New Ticket"
    url: "${{BASE_URL}}/$repo/issues/new/choose"
    style: "primary"
  - text: "My Tickets"
    url: "${{PROJECT_URL}}/projects/1/views/1"
    style: "secondary"

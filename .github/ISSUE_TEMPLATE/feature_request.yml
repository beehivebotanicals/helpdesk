name: 📌Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement", "triage"]
type: Feature
projects: 
  - ${{ vars.DEFAULT_ISSUE_PROJECT }}
  - ${{ vars.SECONDARY_ISSUE_PROJECT }}
body:
  - type: markdown
    attributes:
      value: |
        *Provide short description of feature request*
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: describe-feature
    attributes:
      label: Describe the feature you would like to see
      description: Please be clear and concise
      placeholder: Tell us what you would like to see!
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: identify-problem
    attributes:
      label: Identify the problem this feature solves
      description: Is your feature request related to a problem?
      placeholder: Please describe the problem you are trying to solve.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Please provide any additional information that may help us understand the issue.
      placeholder: Why is it important? Is this urgent?
    validations:
      required: false

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beehive Botanicals HelpDesk</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }
    .header {
      margin: 0;       /* Remove top/bottom margins */
      padding: 0; /* Remove internal padding */
      text-align: left;
      background: #ffffff;
      color: #333;
    }
    .header img {
      padding: 20px;
      max-width: 100%;
      height: auto;
    }
    .content {
      padding: 20px;
      max-width: 800px;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <div class="header">
    <!-- Replace 'images/your-logo.png' with your actual image path -->
    <img src="images/Beehive2.jpg" alt="Beehive Botanicals Logo" class="responsive">
  </div>

  <div class="content">
    <h1>Welcome to the HelpDesk</h1>
    <p>This is a simple landing page hosted on GitHub Pages with an image in the header.</p>
    <p>You can customize the text, links, and styles to match your needs.</p>
  </div>
</body>
</html>

name: 📌Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement", "triage"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Provide short description of feature request
  - type: textarea
    id: describe-feature
    attributes:
      label: Describe the feature you would like to see
      description: A clear and concise description of what the feature is.
      placeholder: Tell us what you would like to see!
      value: "New ideas!"
    validations:
      required: true
  - type: textarea
    id: identify-problem
    attributes:
      label: Identify the problem this feature solves
      description: Is your feature request related to a problem? Please describe 
      placeholder: Please describe the problem you are trying to solve.
      value: "Provide details"
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
      placeholder: Tell us what you see!
      value: "Please provide any additional information that may help us understand the issue."
    validations:
      required: false

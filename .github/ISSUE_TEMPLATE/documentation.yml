name: 📃Documentation
description: Suggest updates or additions to documentation
title: "[Docs]: "
labels: ["bug", "documentation"]
assignees: 
    - rianaventura
type: Documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to provide feedback on our documentation! 
  - type: textarea
    id: describe-update
  - type: textarea
    id: suggested-changes
    attributes:
      label:  Suggested Changes
      description: Provide a detailed description of the changes or addition
      placeholder: What would you like to see?
      value: "Provide details including examples, screenshots, or links to relevant resources."
    validations:
      required: true
  - type: textarea
    id: reason-for-update
    attributes:
      label:  Reason for update
      description: Explain the importance of this update.
      placeholder: Why is this update important? How will it help users?
      value: "Explain the importance of this update"
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
      placeholder: Tell us what you see!
      value: "Please provide any additional information that may help us understand the issue."
    validations:
      required: false

name: 💬 General Report
description: Provide general feedback or inquiries
title: "[General]: "
labels: ["question", "triage"]
type: general
projects: ${{ vars.DEFAULT_ISSUE_PROJECT }}
body:
  - type: markdown
    attributes:
      value: |
        *Provide short description of the general report or comment*
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: describe-feedback
    attributes:
      label: Describe the feedback or inquiry
      description: Please be clear and concise
      placeholder: Tell us what you think...
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Please provide any additional information that may help us understand the issue.
      placeholder: Why is it important? Is this urgent?
    validations:
      required: false

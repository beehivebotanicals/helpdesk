<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beehive Botanicals HelpDesk</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }
    .header {
      margin: 0;       /* Remove top/bottom margins */
      padding: 0; /* Remove internal padding */
      text-align: left;
      background: #ffffff;
      color: #333;
    }
    .header img {
      padding: 20px;
      max-width: 100%;
      height: auto;
    }
    .content {
      padding: 20px;
      max-width: 800px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <div class="header">
    <!-- Replace 'images/your-logo.png' with your actual image path -->
    <img src="images/Beehive2.jpg" alt="Beehive Botanicals Logo" class="responsive">
  </div>

  <div class="content">
    <h1>Welcome to the HelpDesk</h1>
    <p>This is a simple landing page hosted on GitHub Pages with an image in the header.</p>
    <p>You can customize the text, links, and styles to match your needs.</p>
    <a href="https://github.com/rianaventura/beehive/issues/new/choose" class="btn">
      New Ticket
    </a>
    <a href="https://github.com/rianaventura/beehive/issues?q=is%3Aissue+state%3Aopen+author%3A%40me" class="btn">
      My Tickets
    </a>
    <a href="https://rianaventura.github.io/beehive/docs/my-issues.html" class="btn">
      My Issues HTML
    </a>
  </div>
  <!-- The script below displays users tickets -->
  <script>
    async function loadIssues() {
      const token = localStorage.getItem("gh_token");
      const user = await fetch("https://api.github.com/user", {
        headers: { Authorization: `token ${token}` }
      }).then(r => r.json());
    
      const issues = await fetch("https://api.github.com/repos/rianaventura/beehive/issues", {
        headers: { Authorization: `token ${token}` }
      }).then(r => r.json());
    
      const mine = issues.filter(i => i.user.login === user.login);
    
      document.getElementById("issues").innerHTML =
        mine.map(i => `<li><a href="${i.html_url}">${i.title}</a></li>`).join("");
    }
    loadIssues();
  </script>
  <ul id="issues"></ul>
</body>
</html>

name: 📃Documentation
description: Suggest updates or additions to documentation
title: "[Docs]: "
labels: ["bug", "documentation"]
type: Documentation
projects: 
  - ${{ vars.DEFAULT_ISSUE_PROJECT }}
  - ${{ vars.SECONDARY_ISSUE_PROJECT }}
body:
  - type: markdown
    attributes:
      value: |
        *Provide short description of the document update being requested*
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: suggested-changes
    attributes:
      label:  Suggested Changes
      description: Provide details including examples, screenshots, or links to relevant resources."
      placeholder: What would you like to see?
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: reason-for-update
    attributes:
      label:  Reason for update
      description: Please explain why it is necessary
      placeholder: How will it help users?
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Please provide any additional information that may help us understand the issue.
      placeholder: Why is it important? Is this urgent?
    validations:
      required: false

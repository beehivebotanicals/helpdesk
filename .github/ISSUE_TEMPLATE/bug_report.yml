name: 🐞 Bug Report
description: File a bug report (yml).
title: "[Bug]: "
labels: ["bug", "triage"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        *Provide short description of problem*
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: describe-bug
    attributes:
      label: Describe the bug
      description: Please provide a clear and concise description of the bug
      placeholder: What is it that isn't working as expected?
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: reproduce-steps
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      value: "1. Go to '...'\n2. Click on '....'\n3. Scroll down to '....'\n4. See error"
    validations:
      required: true
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Chrome
        - Microsoft Edge
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: markdown
    attributes:
      value: "---"  # This renders as a horizontal divider line
  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Please provide any additional information that may help us understand the issue.
      placeholder: Why is it important? Is this urgent?
    validations:
      required: false
